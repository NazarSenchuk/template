name: Build Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      registry:
        required: true
        type: string
      role_to_assume:
        required: true
        type: string
      aws_region:
        required: true
        type: string
    outputs:
      image_tag:
        description: Built image tag
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin ${{ inputs.registry }}

      - name: Generate image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT


      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          load: true
          tags: ${{ inputs.registry }}/${{ inputs.service }}:${{ steps.tag.outputs.image_tag }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.service }}:${{ steps.tag.outputs.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          output: trivy-report.json
          format: json

      - name: Upload Vulnerability Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      

      - name: Push image
        run: docker push ${{ inputs.registry }}/${{ inputs.service }}:${{ steps.tag.outputs.image_tag }}

