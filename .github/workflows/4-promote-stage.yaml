name: Promote to Stage

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      registry:
        required: true
        type: string
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  promote:
    runs-on: self-hosted
    environment: stage

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
            repository: NazarSenchuk/infrastructure-test
            token: ${{ secrets.PAT_TOKEN }}
            path: infra-repo
            ref: main
      - name: Get latest dev image tag
        id: get-dev-tag
        run: |
          cd infra-repo
          TAG=$(grep 'newTag:' kubernetes/${{ inputs.service }}/overlays/stage/kustomization.yaml | head -n1 | awk '{print $2}')
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      

      - name: Update stage with dev image
        env:
          IMAGE_TAG: ${{ steps.get-dev-tag.outputs.image_tag }}
          ECR_REGISTRY: ${{ inputs.registry }}
          ECR_REPOSITORY: ${{ inputs.service }}
        run: |
          cd infra-repo/kubernetes/${{ inputs.service }}/overlays/stage
          
          # Update image tag
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "Updated stage to use dev image: $IMAGE_TAG"
          cat kustomization.yaml

      - name: Commit stage update
        run: |
          cd infra-repo
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add kubernetes/${{ inputs.service }}/overlays/stage/kustomization.yaml
          git commit -m "Promote to stage: ${{ github.sha_short }}"
          git push origin main

      - name: Create deployment PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Promoted to Stage Environment**
              
              The latest dev image has been promoted to the staging environment.
              ArgoCD will now deploy this to your staging cluster.
              
              **Image Tag:** ${{ steps.get-dev-tag.outputs.image_tag }}
              
              Once verified in staging, create a PR to main for production deployment.`
            });